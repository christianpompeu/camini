name: Observatorio migration replay

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/migrations/20261020123117_observatorio_camini_grafo_v1.sql"
      - "supabase/migrations/20261020182907_observatorio_b1_rpc_indices.sql"
      - "supabase/migrations/20261020192401_observatorio_b1_1_preservacao_editorial.sql"
      - "supabase/migrations/20261020192519_observatorio_b1_1_fix_audit_trigger.sql"
      - "supabase/migrations/20261020195125_observatorio_b1_2_aprovacao_append_only.sql"
      - "supabase/migrations/20261020195308_observatorio_b1_2_index_aprovacoes.sql"
      - "supabase/migrations/20261020195525_observatorio_b1_2_restrict_collection_writer.sql"
      - "supabase/migrations/20261020195803_observatorio_b1_2_revoke_trigger_exec.sql"
      - "supabase/migrations/20261020195900_observatorio_b1_2_revoke_truncate.sql"
      - "supabase/migrations/20261020195912_observatorio_b1_2_proteger_insert_reavaliacao.sql"
      - "supabase/migrations/20261020195924_observatorio_b1_2_fix_search_path.sql"
      - "supabase/migrations/20261020195940_observatorio_b1_2_fix_reavaliacao_trigger.sql"
      - "supabase/migrations/20261020195970_observatorio_b1_2_isolar_coletor.sql"
      - "supabase/migrations/20261020195980_observatorio_b1_2_isolar_coletor_rls.sql"
      - "supabase/migrations/20261021001511_observatorio_marco_b_auditoria_backend.sql"
      - "lib/observatorio/supabase-ingestion.ts"
      - "lib/observatorio/__tests__/supabase-ingestion.test.ts"
      - "lib/supabase/database.types.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/observatorio-replay-fixture.sql"
      - "scripts/observatorio-reavaliacao-fixture.sql"

jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Validate backend adapter
        run: |
          npm ci
          npm run test:observatorio
          npm run test:observatorio-backend
          npx tsc --noEmit

      - name: Bootstrap Supabase-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin bypassrls;
          create schema auth;
          create function auth.uid() returns uuid
            language sql stable as $$ select null::uuid $$;
          SQL

      - name: Apply Observatorio migrations only
        run: |
          for migration in \
            supabase/migrations/20261020123117_observatorio_camini_grafo_v1.sql \
            supabase/migrations/20261020182907_observatorio_b1_rpc_indices.sql \
            supabase/migrations/20261020192401_observatorio_b1_1_preservacao_editorial.sql \
            supabase/migrations/20261020192519_observatorio_b1_1_fix_audit_trigger.sql \
            supabase/migrations/20261020195125_observatorio_b1_2_aprovacao_append_only.sql \
            supabase/migrations/20261020195308_observatorio_b1_2_index_aprovacoes.sql \
            supabase/migrations/20261020195525_observatorio_b1_2_restrict_collection_writer.sql \
            supabase/migrations/20261020195803_observatorio_b1_2_revoke_trigger_exec.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          for migration in \
            supabase/migrations/20261020195900_observatorio_b1_2_revoke_truncate.sql \
            supabase/migrations/20261020195912_observatorio_b1_2_proteger_insert_reavaliacao.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195924_observatorio_b1_2_fix_search_path.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195940_observatorio_b1_2_fix_reavaliacao_trigger.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195970_observatorio_b1_2_isolar_coletor.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261020195980_observatorio_b1_2_isolar_coletor_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261021001511_observatorio_marco_b_auditoria_backend.sql
          psql -v ON_ERROR_STOP=1 -c "grant observatorio_coletor to postgres"

      - name: Schema, grants and security checks
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from information_schema.tables where table_schema='public' and table_name like 'observatorio_%') <> 13 then raise exception 'unexpected Observatorio table count'; end if;
            if (select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname like 'observatorio_%' and c.relrowsecurity) <> 13 then raise exception 'RLS missing'; end if;
            if has_table_privilege('service_role','public.observatorio_decisoes_historico','UPDATE') or has_table_privilege('service_role','public.observatorio_decisoes_historico','DELETE') or has_table_privilege('service_role','public.observatorio_decisoes_historico','TRUNCATE') then raise exception 'audit mutation privilege leaked'; end if;
            if has_table_privilege('service_role','public.observatorio_aprovacoes_editoriais','INSERT') or has_table_privilege('service_role','public.observatorio_aprovacoes_editoriais','TRUNCATE') then raise exception 'approval mutation privilege leaked'; end if;
            if has_function_privilege('service_role','public.observatorio_aprovar_relacao(uuid,text,text)','EXECUTE') or not has_function_privilege('authenticated','public.observatorio_aprovar_relacao(uuid,text,text)','EXECUTE') then raise exception 'approval RPC grants incorrect'; end if;
            if has_function_privilege('anon','public.observatorio_ingest_lote(jsonb)','EXECUTE') or not has_function_privilege('service_role','public.observatorio_ingest_lote(jsonb)','EXECUTE') or not has_function_privilege('observatorio_coletor','public.observatorio_ingest_lote(jsonb)','EXECUTE') then raise exception 'ingest RPC grants incorrect'; end if;
            if has_table_privilege('service_role','public.observatorio_aprovadores','INSERT') or has_table_privilege('service_role','public.observatorio_aprovadores','UPDATE') or has_table_privilege('service_role','public.observatorio_relacoes','UPDATE') then raise exception 'collector boundary leaked'; end if;
            if not has_table_privilege('observatorio_ingest_owner','public.observatorio_decisoes_historico','INSERT') or has_table_privilege('observatorio_ingest_owner','public.observatorio_decisoes_historico','UPDATE') or has_table_privilege('observatorio_ingest_owner','public.observatorio_decisoes_historico','DELETE') or has_table_privilege('observatorio_ingest_owner','public.observatorio_decisoes_historico','TRUNCATE') then raise exception 'audit owner grants incorrect'; end if;
          end $$;
          SQL

      - name: Collector direct writes are denied
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role observatorio_coletor;
          insert into public.observatorio_fontes(nome, dominio, tipo)
          values ('Denied', 'denied.example', 'outro');
          SQL
          then
            echo "collector direct write unexpectedly succeeded"
            exit 1
          fi

      - name: Synthetic fixture and concurrent idempotency
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/observatorio-replay-fixture.sql & first=$!
          psql -v ON_ERROR_STOP=1 -f scripts/observatorio-replay-fixture.sql & second=$!
          wait "$first"
          wait "$second"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if (select count(*) from public.observatorio_rodadas where run_key='replay-b12-synthetic') <> 1 then
              raise exception 'idempotency failed for rounds';
            end if;
            if (select count(*) from public.observatorio_decisoes_historico where run_key='replay-b12-synthetic') = 0 then
              raise exception 'audit trigger did not record fixture';
            end if;
            if (select count(*) from public.observatorio_fontes where dominio='replay.example') <> 1 then raise exception 'duplicate source'; end if;
          end $$;
          SQL

      - name: Re-evaluation trigger coverage
        run: psql -v ON_ERROR_STOP=1 -f scripts/observatorio-reavaliacao-fixture.sql

      - name: Transaction rollback
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role observatorio_coletor;
          select public.observatorio_ingest_lote($json$
          {
            "round":{"run_key":"ci-must-rollback","canal":"tech"},
            "sources":[],
            "relations":[{"origem_chave":"missing-a","destino_chave":"missing-b","tipo":"relacionado"}]
          }$json$::jsonb);
          SQL
          then
            echo "invalid batch unexpectedly succeeded"
            exit 1
          fi
          psql -v ON_ERROR_STOP=1 -c "select 1 / case when count(*) = 0 then 1 else 0 end from public.observatorio_rodadas where run_key='ci-must-rollback'"

      - name: Editorial decisions survive reprocessing
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          update public.observatorio_materias
             set status_verificacao = 'contestado'
           where url_canonica = 'https://replay.example/item';
          update public.observatorio_eventos
             set status_verificacao = 'verificado', status_sanitizacao = 'revisado'
           where chave = 'replay-synthetic-event';
          SQL
          psql -v ON_ERROR_STOP=1 -f scripts/observatorio-replay-fixture.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$ begin
            if not exists (select 1 from public.observatorio_materias where url_canonica='https://replay.example/item' and status_verificacao='contestado') then raise exception 'article editorial decision overwritten'; end if;
            if not exists (select 1 from public.observatorio_eventos where chave='replay-synthetic-event' and status_verificacao='verificado' and status_sanitizacao='revisado') then raise exception 'event editorial decision overwritten'; end if;
          end $$;
          SQL

      - name: Audit is append-only
        run: |
          if psql -v ON_ERROR_STOP=1 <<'SQL'
          set role service_role;
          update public.observatorio_decisoes_historico
             set ator = 'tampered'
           where run_key = 'replay-b12-synthetic';
          SQL
          then
            echo "audit update unexpectedly succeeded"
            exit 1
          fi
